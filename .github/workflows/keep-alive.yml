name: Keep Supabase Alive

on:
  schedule:
    # Todos los días a las 10:00 AM UTC (6:00 AM Venezuela)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Endpoint Keep-Alive
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" "https://asistencia-fermin-toro.vercel.app/api/keep-alive")
          cat /tmp/response.json
          echo ""
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: El endpoint no devolvió 200 OK"
            exit 1
          fi